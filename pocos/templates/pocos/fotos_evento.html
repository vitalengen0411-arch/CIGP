<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Fotos do evento — CIGP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            background: #fff;
            color: #17313b;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .voltar {
            display: inline-block;
            margin-bottom: 12px;
            color: #287bb5;
            text-decoration: none;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 16px;
        }

        .informacoes {
            margin-bottom: 14px;
            color: #536d78;
            line-height: 1.5;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(140px, 1fr)
            );
            gap: 10px;
        }

        .foto {
            margin: 0;
            padding: 0;
            overflow: hidden;
            border: 1px solid #dce6e9;
            border-radius: 6px;
            background: #f1f5f7;
            cursor: pointer;
        }

        .foto img {
            display: block;
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .foto span {
            display: block;
            padding: 6px;
            color: #17313b;
            font-size: 11px;
        }

        .vazio {
            padding: 16px;
            background: #f1f5f7;
            border-radius: 6px;
        }

        dialog {
            width: calc(100% - 24px);
            max-width: 900px;
            max-height: 90vh;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #fff;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.7);
        }

        .barra-imagem {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .fechar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            padding: 0;
            border: 1px solid #dce6e9;
            border-radius: 4px;
            background: #fff;
            color: #17313b;
            font-size: 18px;
            cursor: pointer;
        }

        #imagem-ampliada {
            display: block;
            width: 100%;
            max-height: 72vh;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <a
        class="voltar"
        href="{% url 'historico_poco' poco.pk %}{% if request.GET.mini == '1' %}?mini=1{% endif %}"
    >
        ← Voltar ao histórico
    </a>

    <h1>Fotos do evento — {{ poco.identificacao }}</h1>

    <div class="informacoes">
        <strong>{{ evento.get_tipo_evento_display }}</strong>
        <br>
        {{ evento.registrado_em|date:"d/m/Y H:i" }}
        — {{ evento.responsavel|default:"Responsável não informado" }}
    </div>

    <div class="galeria">
        {% for foto in fotos %}
            <button
                type="button"
                class="foto"
                data-imagem="{% url 'imagem_evento' poco.pk evento.pk foto.pk %}"
                data-titulo="Foto {{ forloop.counter }}"
                aria-label="Ampliar foto {{ forloop.counter }}"
            >
                <img
                    src="{% url 'imagem_evento' poco.pk evento.pk foto.pk %}"
                    alt="Foto {{ forloop.counter }} do evento"
                    loading="lazy"
                >

                <span>Foto {{ forloop.counter }}</span>
            </button>
        {% empty %}
            <p class="vazio">
                Este evento não possui fotos.
            </p>
        {% endfor %}
    </div>

    <dialog id="visualizador">
        <div class="barra-imagem">
            <strong id="titulo-imagem">Foto</strong>

            <button
                type="button"
                class="fechar"
                id="fechar-imagem"
                title="Fechar imagem"
                aria-label="Fechar imagem"
            >
                ×
            </button>
        </div>

        <img id="imagem-ampliada" alt="">
    </dialog>

    <script>
        const visualizador = document.getElementById("visualizador");
        const imagemAmpliada = document.getElementById("imagem-ampliada");
        const tituloImagem = document.getElementById("titulo-imagem");

        document.querySelectorAll(".foto").forEach((botao) => {
            botao.addEventListener("click", () => {
                imagemAmpliada.src = botao.dataset.imagem;
                imagemAmpliada.alt = botao.dataset.titulo;
                tituloImagem.textContent = botao.dataset.titulo;

                visualizador.showModal();
            });
        });

        document.getElementById("fechar-imagem").addEventListener(
            "click",
            () => visualizador.close()
        );

        visualizador.addEventListener("click", (evento) => {
            if (evento.target !== visualizador) {
                return;
            }

            const limites = visualizador.getBoundingClientRect();

            if (
                evento.clientX < limites.left ||
                evento.clientX > limites.right ||
                evento.clientY < limites.top ||
                evento.clientY > limites.bottom
            ) {
                visualizador.close();
            }
        });

        visualizador.addEventListener("close", () => {
            imagemAmpliada.removeAttribute("src");
        });
    </script>
</body>
</html>
